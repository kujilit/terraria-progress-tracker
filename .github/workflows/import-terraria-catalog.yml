name: Import Terraria Wiki catalog

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'supabase/migrations/002_terraria_wiki_catalog.sql'
      - '.github/workflows/import-terraria-catalog.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate Wiki data without writing to Supabase"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: read

concurrency:
  group: terraria-wiki-catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run importer unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Import Terraria Wiki catalog
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python scripts/import_terraria_wiki.py --dry-run
          else
            python scripts/import_terraria_wiki.py
          fi
